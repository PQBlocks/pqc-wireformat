[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pqblocks-wire"
version = "0.1.0"
description = "Length-prefixed container format (PQCWF1) for ML-KEM ciphertexts and ML-DSA / SLH-DSA signatures, with thin wrappers over liboqs-python and pyca/cryptography; it implements no primitive itself."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{name = "The PQBlocks Authors"}]
keywords = ["post-quantum", "ml-kem", "ml-dsa", "slh-dsa", "wire-format", "serialization", "composite-signatures", "hybrid-key-exchange", "liboqs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["cryptography", "liboqs-python"]

[project.optional-dependencies]
test = ["pytest", "kyber-py"]

[project.urls]
Homepage = "https://github.com/PQBlocks/pqc-wireformat"
Documentation = "https://github.com/PQBlocks/pqc-wireformat#readme"
Source = "https://github.com/PQBlocks/pqc-wireformat"
Changelog = "https://github.com/PQBlocks/pqc-wireformat/blob/main/CHANGELOG.md"
Issues = "https://github.com/PQBlocks/pqc-wireformat/issues"
Security = "https://github.com/PQBlocks/pqc-wireformat/security/policy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
